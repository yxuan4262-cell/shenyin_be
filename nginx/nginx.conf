# ============================================================
#  第十阶段·第三课 练习A：Nginx 反向代理（对外唯一入口，做"同门牌"网关）
#  挂载位置：容器 /etc/nginx/conf.d/default.conf（官方 nginx 镜像自动 include）
#
#  设计要点（对应四道思考题）：
#   - Q1：app 不再发布 8080 到公网，Nginx 走【店内内线】http://app:8080 访问它
#   - Q2：给后端补 X-Forwarded-* 头 + 对 SSE 路由关缓冲（proxy_buffering off）
#   - Q4：/actuator 默认拒公网，防健康检查/端点泄露依赖信息
#   - 同门牌：/（前端静态·暂未部署）与 /api/（后端接口）对外都是同一个 host
# ============================================================

# 后厨内线：compose 网络里 app 服务名 = DNS，端口是容器内 8080（不对公网）
upstream zhiguang_app {
    server app:8080;
}

# ---------- 开发可先跑的 HTTP 版（无需证书即可验证反代链路） ----------
server {
    listen 80;
    server_name _;                     # 本地/无域名用 _ 通配；上线填 zhiguang.com

    # ① 前端静态：命中非 /api 与 /actuator 的一切请求 → 服务 dist（与 /api 同一门牌，无需 CORS）
    location / {
        root  /usr/share/nginx/html;              # = compose 挂进来的 ../zhiguang_fe/dist
        index index.html;
        try_files $uri $uri/ /index.html;         # React Router 前端路由刷新不 404（回退到 index.html）
    }

    # ② 后端 API 反代：所有接口都在 /api/v1/ 下，故 /api/ 全量转发到 app:8080
    location /api/ {
        proxy_pass http://zhiguang_app;
        proxy_http_version 1.1;

        # 传菜条：告诉后厨"真实客人 IP / 原始协议"，配合 Spring 的 forward-headers-strategy
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式问答(/api/v1/knowposts/*/qa/stream)必须关缓冲，否则"一个字一个字吐"被攒成整块
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;        # 流式/长回答不要被默认 60s 掐断
    }

    # ③ 健康检查/管理端点：默认【不对公网开】(Q4 闸门)
    #    运维需从内网访问时，改为 allow <内网段>; deny all; 或走独立 management 端口
    location /actuator/ {
        deny all;
        default_type text/plain;
        return 403 "actuator is internal-only\n";
    }
}

# ---------- 第六课B·启用 HTTPS（TLS 在 nginx 边缘终结，再走 http 内线给 app） ----------
# 证书：nginx/certs/{fullchain.pem,privkey.pem}（本地自签，compose 挂到容器 /etc/nginx/certs）
# 生产：换成 Let's Encrypt(certbot) 签发的证书，并把 server_name 改成真实域名
server {
    listen 443 ssl;
    http2 on;
    server_name localhost;             # 上线改 zhiguang.com

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;   # HSTS：以后只走 https

    # ① 前端静态（同 80）
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ② 后端 API 反代
    location /api/ {
        proxy_pass http://zhiguang_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # 此处 $scheme=https → Spring 据 X-Forwarded-Proto 还原 isSecure()=true
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
    }

    # ③ 管理端点拒公网
    location /actuator/ {
        deny all;
        default_type text/plain;
        return 403 "actuator is internal-only\n";
    }
}

# 上线若要“http 一律跳 https”，把上面 80 的 server 块内容换成：
#   return 301 https://$host$request_uri;
