# ============================================================
#  Canal 配置（监听 MySQL binlog → 投递 Kafka）
#  本地未部署 Canal Server，enabled=false；
#  注意：当前代码 start() 未检查 enabled，连接失败仅打印错误日志，不影响启动
# ============================================================
canal:
  enabled: false
  host: localhost
  port: 11111
  destination: example
  username: canal
  password: canal
  filter: zhiguang\\.outbox
  batchSize: 100
  intervalMs: 500
